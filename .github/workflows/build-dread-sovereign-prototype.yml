name: Build Dread Sovereign Prototype

on:
  push:
    branches:
      - prototype/dread-sovereign
    paths:
      - 'prototype/dread-sovereign-source-*.tar.gz'
      - 'prototype/DREAD_SOVEREIGN_PROTOTYPE.md'
      - '.github/workflows/build-dread-sovereign-prototype.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Expand prototype source
        shell: bash
        run: |
          rm -rf prototype/dread-sovereign
          mkdir -p prototype/dread-sovereign
          echo '16124fa9de65d9926261eabcd0be0b0f58a63409289cf067a17c95340c7200c5  prototype/dread-sovereign-source-0.1.3.tar.gz' \
            | sha256sum --check --strict
          tar -xzf prototype/dread-sovereign-source-0.1.3.tar.gz -C prototype/dread-sovereign

      - name: Compile and package
        id: build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p prototype/dread-sovereign/build
          gradle -p prototype/dread-sovereign clean assemble --stacktrace --no-configuration-cache 2>&1 \
            | tee prototype/dread-sovereign/build/build-output.log

      - name: Verify packaged mixins
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find prototype/dread-sovereign/build/libs -maxdepth 1 -name '*.jar' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'com/phaedrusxy/dreadsovereign/mixin/DragonBaseEntityMixin.class'
          if jar tf "$JAR" | grep -q 'EntityAllianceMixin.class'; then
            echo 'Unexpected EntityAllianceMixin remained in the packaged JAR.' >&2
            exit 1
          fi
          if jar tf "$JAR" | grep -q 'LivingEntityAllianceMixin.class'; then
            echo 'Unexpected LivingEntityAllianceMixin remained in the packaged JAR.' >&2
            exit 1
          fi
          unzip -p "$JAR" dreadsovereign.mixins.json | grep -q 'DragonBaseEntityMixin'
          if unzip -p "$JAR" dreadsovereign.mixins.json | grep -Eq 'EntityAllianceMixin|LivingEntityAllianceMixin'; then
            echo 'Removed vanilla mixins are still referenced by dreadsovereign.mixins.json.' >&2
            exit 1
          fi
          javap -classpath "$JAR" -v com.phaedrusxy.dreadsovereign.mixin.DragonBaseEntityMixin \
            | grep -q 'RuntimeInvisibleAnnotations'

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dread-sovereign-build-log
          path: prototype/dread-sovereign/build/build-output.log
          if-no-files-found: warn

      - name: Upload prototype JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dread-sovereign-prototype
          path: prototype/dread-sovereign/build/libs/*.jar
          if-no-files-found: error
