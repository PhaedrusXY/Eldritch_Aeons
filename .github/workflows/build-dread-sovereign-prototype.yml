name: Build Dread Sovereign Prototype

on:
  push:
    branches:
      - prototype/dread-sovereign
    paths:
      - 'prototype/dread-sovereign-source-0.1.3.tar.gz.b64.part*'
      - 'prototype/DREAD_SOVEREIGN_PROTOTYPE.md'
      - '.github/workflows/build-dread-sovereign-prototype.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Expand verified event-based source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prototype/dread-sovereign
          mkdir -p prototype/dread-sovereign
          cat \
            prototype/dread-sovereign-source-0.1.3.tar.gz.b64.part00 \
            prototype/dread-sovereign-source-0.1.3.tar.gz.b64.part01 \
            prototype/dread-sovereign-source-0.1.3.tar.gz.b64.part02 \
            prototype/dread-sovereign-source-0.1.3.tar.gz.b64.part03 \
            prototype/dread-sovereign-source-0.1.3.tar.gz.b64.part04 \
            prototype/dread-sovereign-source-0.1.3.tar.gz.b64.part05 \
            | base64 --decode > prototype/dread-sovereign-source-0.1.3.tar.gz
          echo '16124fa9de65d9926261eabcd0be0b0f58a63409289cf067a17c95340c7200c5  prototype/dread-sovereign-source-0.1.3.tar.gz' \
            | sha256sum --check --strict
          tar -xzf prototype/dread-sovereign-source-0.1.3.tar.gz -C prototype/dread-sovereign
          test ! -e prototype/dread-sovereign/src/main/java/com/phaedrusxy/dreadsovereign/mixin/EntityAllianceMixin.java
          test ! -e prototype/dread-sovereign/src/main/java/com/phaedrusxy/dreadsovereign/mixin/LivingEntityAllianceMixin.java
          grep -q '"DragonBaseEntityMixin"' prototype/dread-sovereign/src/main/resources/dreadsovereign.mixins.json
          if grep -Eq 'EntityAllianceMixin|LivingEntityAllianceMixin' prototype/dread-sovereign/src/main/resources/dreadsovereign.mixins.json; then
            echo 'Removed vanilla mixins remain in the source mixin configuration.' >&2
            exit 1
          fi

      - name: Compile
        shell: bash
        run: |
          set -o pipefail
          mkdir -p prototype/dread-sovereign/build
          gradle -p prototype/dread-sovereign clean assemble --stacktrace --no-configuration-cache 2>&1 \
            | tee prototype/dread-sovereign/build/build-output.log

      - name: Repackage loading hotfix as 0.1.4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED

          libs = Path('prototype/dread-sovereign/build/libs')
          source = next(libs.glob('dread-sovereign-0.1.3-prototype.jar'))
          target = libs / 'dread-sovereign-0.1.4-prototype.jar'
          omitted = {
              'com/phaedrusxy/dreadsovereign/mixin/AllianceRules.class',
          }

          with ZipFile(source, 'r') as zin, ZipFile(target, 'w', compression=ZIP_DEFLATED, compresslevel=9) as zout:
              for info in zin.infolist():
                  if info.filename in omitted:
                      continue
                  data = zin.read(info.filename)
                  if info.filename == 'META-INF/neoforge.mods.toml':
                      text = data.decode('utf-8')
                      marker = 'version="0.1.3-prototype"'
                      if marker not in text:
                          raise SystemExit('Expected 0.1.3 version marker is missing.')
                      data = text.replace(marker, 'version="0.1.4-prototype"', 1).encode('utf-8')

                  output_info = ZipInfo(info.filename, info.date_time)
                  output_info.compress_type = ZIP_DEFLATED
                  output_info.comment = info.comment
                  output_info.extra = info.extra
                  output_info.internal_attr = info.internal_attr
                  output_info.external_attr = info.external_attr
                  output_info.create_system = info.create_system
                  output_info.flag_bits = info.flag_bits
                  zout.writestr(output_info, data)

          source.unlink()
          PY

      - name: Verify packaged hotfix
        shell: bash
        run: |
          set -euo pipefail
          JAR='prototype/dread-sovereign/build/libs/dread-sovereign-0.1.4-prototype.jar'
          test -f "$JAR"
          unzip -t "$JAR"
          jar tf "$JAR" | grep -q 'com/phaedrusxy/dreadsovereign/mixin/DragonBaseEntityMixin.class'
          if jar tf "$JAR" | grep -Eq 'AllianceRules.class|EntityAllianceMixin.class|LivingEntityAllianceMixin.class'; then
            echo 'A forbidden helper or removed vanilla mixin was packaged in the JAR.' >&2
            exit 1
          fi
          unzip -p "$JAR" dreadsovereign.mixins.json | grep -q 'DragonBaseEntityMixin'
          if unzip -p "$JAR" dreadsovereign.mixins.json | grep -Eq 'AllianceRules|EntityAllianceMixin|LivingEntityAllianceMixin'; then
            echo 'Forbidden or removed classes remain in the packaged mixin configuration.' >&2
            exit 1
          fi
          if unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -vq 'version="0.1.4-prototype"'; then
            echo 'Packaged mod version was not updated to 0.1.4.' >&2
            exit 1
          fi
          rm -rf /tmp/dreadsovereign-scan
          mkdir -p /tmp/dreadsovereign-scan
          (cd /tmp/dreadsovereign-scan && jar xf "$GITHUB_WORKSPACE/$JAR")
          if grep -RIl --binary-files=text 'com/phaedrusxy/dreadsovereign/mixin/AllianceRules' /tmp/dreadsovereign-scan; then
            echo 'A compiled class still references AllianceRules inside the mixin package.' >&2
            exit 1
          fi
          javap -classpath "$JAR" -v com.phaedrusxy.dreadsovereign.mixin.DragonBaseEntityMixin \
            | grep -q 'RuntimeInvisibleAnnotations'

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dread-sovereign-build-log
          path: prototype/dread-sovereign/build/build-output.log
          if-no-files-found: warn

      - name: Upload prototype JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dread-sovereign-prototype-0.1.4
          path: prototype/dread-sovereign/build/libs/dread-sovereign-0.1.4-prototype.jar
          if-no-files-found: error
