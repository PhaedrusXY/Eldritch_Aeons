name: Build Dread Sovereign Prototype

on:
  push:
    branches:
      - prototype/dread-sovereign
    paths:
      - 'prototype/dread-sovereign-source.tar.gz.b64.part*'
      - 'prototype/DREAD_SOVEREIGN_PROTOTYPE.md'
      - '.github/workflows/build-dread-sovereign-prototype.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Expand prototype source
        shell: bash
        run: |
          rm -rf prototype/dread-sovereign
          mkdir -p prototype/dread-sovereign
          cat prototype/dread-sovereign-source.tar.gz.b64.part* \
            | base64 --decode > prototype/dread-sovereign-source.tar.gz
          echo '53c55f425489d3beb7d7d08d38b62b542f0e89a88be96559d95d9e04322d7a79  prototype/dread-sovereign-source.tar.gz' \
            | sha256sum --check --strict
          tar -xzf prototype/dread-sovereign-source.tar.gz -C prototype/dread-sovereign

      - name: Compile and package
        id: build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p prototype/dread-sovereign/build
          gradle -p prototype/dread-sovereign clean assemble --stacktrace --no-configuration-cache 2>&1 \
            | tee prototype/dread-sovereign/build/build-output.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dread-sovereign-build-log
          path: prototype/dread-sovereign/build/build-output.log
          if-no-files-found: warn

      - name: Upload prototype JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dread-sovereign-prototype
          path: prototype/dread-sovereign/build/libs/*.jar
          if-no-files-found: error
