name: Dread Incursions Rhino regression
on:
  push:
    branches: [fix/dread-rhino-scoping]
    paths: ['tests/dread-rhino/**', '.github/workflows/test-dread-rhino.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rhino:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact Rhino engine and standalone dependencies
        run: |
          set -euo pipefail
          mkdir -p tests/dread-rhino/lib
          cd tests/dread-rhino/lib
          curl -fLsS 'https://cdn.modrinth.com/data/sk9knFPE/versions/SqkDvOLG/rhino-2101.2.8-build.91.jar' -o rhino.jar
          curl -fLsS 'https://repo.maven.apache.org/maven2/com/google/guava/guava/32.1.2-jre/guava-32.1.2-jre.jar' -o guava.jar
          curl -fLsS 'https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar' -o gson.jar
          curl -fLsS 'https://repo.maven.apache.org/maven2/org/slf4j/slf4j-api/2.0.9/slf4j-api-2.0.9.jar' -o slf4j.jar
          curl -fLsS 'https://repo.maven.apache.org/maven2/org/jetbrains/annotations/24.1.0/annotations-24.1.0.jar' -o annotations.jar
          sha256sum rhino.jar
      - name: Reproduce old loop failure and test replacement loops
        run: |
          set -euo pipefail
          cd tests/dread-rhino
          javac -cp 'lib/*' RhinoRegression.java
          java -cp '.:lib/*' RhinoRegression | tee result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dread-rhino-regression-results
          path: tests/dread-rhino/result.txt
          if-no-files-found: warn
