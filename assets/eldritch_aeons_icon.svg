      <stop offset="0.55" stop-color="#5bc9ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#b05cff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
