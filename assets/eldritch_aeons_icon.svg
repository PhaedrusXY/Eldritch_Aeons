<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Eldritch Aeons icon</title>
  <desc id="desc">A dragon breathes fire toward a small mage protected by a glowing arcane bubble.</desc>
  <defs>
