plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
repositories { mavenCentral() }
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// CI-only native integration harness. This source directory is NOT part of a normal build.
if (providers.gradleProperty('shieldRuntimeTest').isPresent()) {
    sourceSets.main.java.srcDir 'src/testRuntime/java'
}

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file(providers.gradleProperty('shieldTestRunDir').getOrElse('run'))
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}
configurations { runtimeClasspath.extendsFrom localRuntime }
dependencies {
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.5'))
    def buildASpellJar = file('libs/buildaspell-1.0.3-mc26.1.2.jar')
    if (buildASpellJar.exists()) {
        compileOnly files(buildASpellJar)
        localRuntime files(buildASpellJar)
    }
}
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, mod_id: mod_id, mod_name: mod_name,
        mod_license: mod_license, mod_version: mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar).configure {
    manifest {
        attributes(['Implementation-Title': mod_name, 'Implementation-Version': mod_version,
                    'Implementation-Vendor': 'PhaedrusXY'])
    }
}
