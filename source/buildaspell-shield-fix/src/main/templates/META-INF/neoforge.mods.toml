license="${mod_license}"
issueTrackerURL="https://github.com/PhaedrusXY/Eldritch_Aeons/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="PhaedrusXY"
displayURL="https://github.com/PhaedrusXY/Eldritch_Aeons"
description='''
Standalone compatibility corrections for Build A Spell 1.0.3.
Shield capacity and non-stacking absorption are fixed natively; KubeJS is not required.
Fill does not amplify Break or Evaporate Water. Break + Chain provides limited
same-block excavation. Conjure + Floor + Fill creates a flat platform.
'''

[[mixins]]
config="bas_shield_fix.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="buildaspell"
type="required"
reason="Targets Build A Spell 1.0.3 spell executors and projectile chaining."
versionRange="[1.0.3,1.0.4)"
ordering="AFTER"
side="BOTH"
