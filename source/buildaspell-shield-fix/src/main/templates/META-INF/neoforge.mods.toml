license="${mod_license}"
issueTrackerURL="https://github.com/PhaedrusXY/Eldritch_Aeons/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="PhaedrusXY"
displayURL="https://github.com/PhaedrusXY/Eldritch_Aeons"
description='''
Compatibility corrections for Build A Spell 1.0.3: Shield recasts upgrade instead of stacking.
Fill applies to creation, not mass destruction. Break + Chain spreads through a limited
number of matching blocks. Conjure + Floor + Fill creates a flat platform.
'''

[[mixins]]
config="bas_shield_fix.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="buildaspell"
type="required"
reason="This patch targets Build A Spell's Shield executor."
versionRange="[1.0.3,1.0.4)"
ordering="AFTER"
side="BOTH"
